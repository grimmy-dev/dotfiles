set-option -g default-shell /bin/zsh

# start with window 1 (instead of 0)
set -g base-index 1

# start with pane 1
set -g pane-base-index 1

# close a window in the middle, the rest shift down so numbers stay 1..n
set -g renumber-windows on

# remap prefix from 'C-b' to 'C-'
unbind C-b
set-option -g prefix C-space
bind-key C-space send-prefix

# split panes using | and -, keeping the current directory
bind -N "split pane right" | split-window -h -c "#{pane_current_path}"
bind -N "split pane down" - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on

# no delay after escape, so vim in a pane stays responsive
set -sg escape-time 0
set -g history-limit 50000
set -g focus-events on

bind-key -N "new window" -n C-t new-window -c "#{pane_current_path}"
bind-key -N "kill window" -n C-w kill-window

# alt+arrows move between panes, shift makes it windows
bind -N "focus pane left" -n M-Left select-pane -L
bind -N "focus pane right" -n M-Right select-pane -R
bind -N "focus pane up" -n M-Up select-pane -U
bind -N "focus pane down" -n M-Down select-pane -D
bind -N "previous window" -n M-S-Left previous-window
bind -N "next window" -n M-S-Right next-window
bind-key -N "next window" -n C-Tab next-window
bind-key -N "previous window" -n C-S-Tab previous-window

# drag a window left or right in the tab order
bind -N "move window left" -n C-S-Left swap-window -t -1 \; select-window -t -1
bind -N "move window right" -n C-S-Right swap-window -t +1 \; select-window -t +1

# resize the focused pane
bind -N "resize pane left" -r H resize-pane -L 5
bind -N "resize pane down" -r J resize-pane -D 5
bind -N "resize pane up" -r K resize-pane -U 5
bind -N "resize pane right" -r L resize-pane -R 5

# reload this file without restarting the server
bind -N "reload tmux.conf" r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# every binding with a note, in a popup over the current window
bind -N "show this list" ? display-popup -E -w 70% -h 70% "tmux list-keys -N | sort -k2 | less -R"

setw -g mode-keys vi
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"

# set default terminal mode to 256 colors
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# DESIGN TWEAKS

# don't do anything when a 'bell' rings
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# nightfox palette, matching the alacritty theme
set -g @bg      "#192330"
set -g @fg      "#cdcecf"
set -g @surface "#29394f"
set -g @muted   "#575860"
set -g @blue    "#719cd6"
set -g @cyan    "#63cdcf"
set -g @green   "#81b29a"
set -g @yellow  "#dbc074"
set -g @red     "#c94f6d"

# clock mode
setw -g clock-mode-colour "#63cdcf"

# copy mode
setw -g mode-style 'fg=#192330 bg=#dbc074 bold'

# panes
set -g pane-border-style 'fg=#29394f'
set -g pane-active-border-style 'fg=#719cd6'

# statusbar
set -g status-position bottom
set -g status-justify left
set -g status-interval 5
set -g status-style 'fg=#cdcecf bg=#192330'

# session name, turning yellow while the prefix is held
set -g status-left '#[fg=#192330,bg=#{?client_prefix,#dbc074,#719cd6},bold]  #S #[fg=#{?client_prefix,#dbc074,#719cd6},bg=#192330,nobold]  '
set -g status-left-length 40

# key hints, then clock
set -g status-right '#[fg=#29394f,bg=#192330]#[fg=#dbc074,bg=#29394f]  ^space prefix #[fg=#575860]│#[fg=#dbc074] ^t new #[fg=#575860]│#[fg=#dbc074] ^w kill #[fg=#575860]│#[fg=#dbc074] | split #[fg=#575860]│#[fg=#dbc074] - vsplit #[fg=#575860]│#[fg=#dbc074] A-S-←→ window #[fg=#575860]│#[fg=#dbc074] ^space ? keys  #[fg=#29394f,bg=#dbc074]#[fg=#192330,bg=#dbc074,bold] %Y-%m-%d %H:%M #[fg=#dbc074,bg=#192330,nobold]'
set -g status-right-length 150

# windows as slanted tabs, active one filled blue
set -g window-status-separator ' '
setw -g window-status-current-format '#[fg=#719cd6,bg=#192330]#[fg=#192330,bg=#719cd6,bold] #I #W #{?window_zoomed_flag,  ,}#[fg=#719cd6,bg=#192330,nobold]'
setw -g window-status-format '#[fg=#29394f,bg=#192330]#[fg=#cdcecf,bg=#29394f] #I #[fg=#575860]#W #[fg=#29394f,bg=#192330]'
setw -g window-status-bell-style 'fg=#192330 bg=#c94f6d bold'

# messages
set -g message-style 'fg=#192330 bg=#dbc074 bold'
